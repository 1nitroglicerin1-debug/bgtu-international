<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BSTU International — Version française du site du centre de coopération internationale de l'Université technique d'État de Briansk. À venir.">
    <title>BSTU International — Version française à venir</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
            colors: { brand: { blue: '#003366', accent: '#EAB308' } }
        }}}
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        a { color: inherit !important; text-decoration: none !important; }
        .hero-fr { background: linear-gradient(rgba(0,30,60,0.9), rgba(0,30,60,0.95)), url('https://images.unsplash.com/photo-1423666639041-f56000c27a9f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover fixed; }
        .mega-menu-content { display: none; position: absolute; left: 0; top: 100%; width: 100vw; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 2px solid #003366; z-index: 100; padding: 2rem 0; opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease; transform: translateY(10px); }
        .nav-item:hover .mega-menu-content { display: block; opacity: 1; transform: translateY(0); }
        .mega-menu-inner { max-width: 80rem; margin: 0 auto; padding: 0 1rem; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem; }
        .mega-menu-column h4 { color: #003366; font-weight: 700; font-size: 1.1rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e5e7eb; }
        .mega-menu-column ul { list-style: none; padding: 0; margin: 0; }
        .mega-menu-column li { margin-bottom: 0.5rem; }
        .mega-menu-column a { color: #4b5563 !important; text-decoration: none !important; font-size: 0.9rem; transition: color 0.2s; display: flex; align-items: center; }
        .mega-menu-column a:hover { color: #EAB308 !important; }
        .mega-menu-column a i { font-size: 0.7rem; margin-right: 0.5rem; color: #9ca3af; }
        body { padding-top: 140px; }
        @media (min-width: 768px) { body { padding-top: 170px; } }
    </style>
</head>
<body class="font-sans text-gray-800 bg-gray-50 min-h-screen flex flex-col">

    <div id="header-placeholder"></div>
    <script src="header.js?v=3" charset="UTF-8" data-page="fr.html"></script>

    <main class="flex-1 flex items-center">
        <section class="hero-fr w-full text-white py-20 md:py-32">
            <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-brand-accent/20 border border-brand-accent/40 text-brand-accent text-xs font-bold uppercase tracking-wider mb-6">
                    <i class="fas fa-globe"></i> Version française
                </div>
                <h1 class="text-4xl md:text-6xl font-serif font-bold mb-6 leading-tight">
                    Bientôt disponible
                </h1>
                <p class="text-lg md:text-xl text-gray-300 mb-8 max-w-2xl mx-auto leading-relaxed">
                    La version française de notre site est en cours de développement. En attendant, veuillez utiliser la version russe ou contactez-nous directement — nous parlons français !
                </p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="index.html" class="bg-brand-accent !text-brand-blue px-8 py-4 rounded-full font-bold text-lg hover:bg-yellow-500 transition-all shadow-lg flex items-center justify-center gap-2">
                        <i class="fas fa-globe"></i> Aller à la version russe
                    </a>
                    <a href="mailto:inter@tu-bryansk.ru" class="bg-white/10 !text-white px-8 py-4 rounded-full font-bold text-lg hover:bg-white/20 transition-all border border-white/30 flex items-center justify-center gap-2">
                        <i class="fas fa-envelope"></i> Nous écrire
                    </a>
                </div>

                <div class="mt-12 flex flex-wrap justify-center gap-6 text-sm text-gray-400">
                    <a href="tel:+74832588274" class="hover:!text-brand-accent flex items-center gap-2">
                        <i class="fas fa-phone-alt"></i> +7 (4832) 58-82-74
                    </a>
                    <span class="flex items-center gap-2">
                        <i class="far fa-clock"></i> Lun–Ven 10h00–16h00 (MSK)
                    </span>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="footer.js?v=3" charset="UTF-8"></script>
</body>
</html>
